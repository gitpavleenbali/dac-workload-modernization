openapi: 3.1.0
info:
  title: Grid Telemetry & Dispatch Service API
  version: 2.0.0
  description: Cloud-native AKS substation telemetry ingestion, Service Bus batch streaming, and grid frequency health API.
paths:
  /healthz:
    get:
      summary: Kubernetes liveness and readiness probe returning pod runtime mode and buffer depth
  /v1/grid/status:
    get:
      summary: Retrieve current regional grid nominal frequency, active frequency-deviation alerts, and latest substation reading
  /v1/telemetry:
    post:
      summary: Idempotently ingest single substation voltage and frequency telemetry reading
  /v1/telemetry/batch:
    post:
      summary: Asynchronously enqueue high-frequency substation telemetry batch via Azure Service Bus Premium
  /v1/telemetry/recent:
    get:
      summary: List most recent 25 telemetry readings in the active window

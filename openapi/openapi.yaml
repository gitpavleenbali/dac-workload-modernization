openapi: 3.1.0
info:
  title: Grid Telemetry & Dispatch Service API
  version: 1.0.0
  description: Substation telemetry ingestion and grid frequency health API.
paths:
  /healthz:
    get:
      summary: Liveness and readiness probe returning active runtime mode and buffer depth
  /v1/grid/status:
    get:
      summary: Retrieve current regional grid nominal frequency, active frequency-deviation alerts, and latest substation reading
  /v1/telemetry:
    post:
      summary: Idempotently ingest substation voltage and frequency telemetry reading
  /v1/telemetry/recent:
    get:
      summary: List most recent 25 telemetry readings in the active window
